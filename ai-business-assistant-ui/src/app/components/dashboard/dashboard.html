<div class="row g-3">

    <div class="mb-4">

    </div>
    <div class="col-12 col-sm-6 col-lg-3">
        <app-stat-card icon="bi-people" value=123 label="Total Customers" color="text-customers"
            secondaryLabel="Registered customers">
        </app-stat-card>
    </div>

    <div class="col-12 col-sm-6 col-lg-3">
        <app-stat-card icon="bi-bag" value=456 label="Total Orders" color="text-orders"
            secondaryLabel="All recorded orders">
        </app-stat-card>
    </div>

    <div class="col-12 col-sm-6 col-lg-3">
        <app-stat-card icon="bi-currency-rupee" value=789 label="Revenue" color="text-revenue"
            secondaryLabel="Illustrative total">
        </app-stat-card>

        <app-stat-card icon="bi-clock" value=1011 label="Pending Orders" color="text-pending"
            secondaryLabel="Awaiting processing">
        </app-stat-card>
