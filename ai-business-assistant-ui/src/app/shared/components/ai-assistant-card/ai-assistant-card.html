<div class="card ai-card p-4">
    <div class="card-body p-0">

        <div class="d-flex align-items-start mb-3">
            <span class="bot-icon-wrapper">
                <i class="fa-solid fa-robot"></i>
            </span>
            <div>
                <h4 class="fw-bold text-dark mb-1 fs-5">AI Business Assistant</h4>
                <p class="text-secondary mb-0 fs-6">Ask questions about your business data.</p>
            </div>
        </div>

        <div class="suggestions-box p-3 mb-3">
            <p class="text-secondary mb-2 fs-6">Try asking:</p>
            <ul class="custom-bullets fs-6">
                <li>Show pending orders</li>
                <li>Which products are low in stock?</li>
                <li>Summarize this month's revenue</li>
            </ul>
        </div>

        <div class="mb-3">
            <input type="text" class="form-control chat-input" placeholder="Ask your business assistant...">
        </div>

        <div class="d-flex justify-content-end">
            <button type="button" class="plan-btn">Plan this UI</button>
        </div>

    </div>
</div>
