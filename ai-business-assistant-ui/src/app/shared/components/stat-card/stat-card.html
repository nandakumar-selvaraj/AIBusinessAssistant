<div class="card border-0 shadow-sm rounded-4 h-100">
  <div class="card-body p-3">
    <!-- Top Row: Circular Icon Badge, Title, Info Icon -->
    <div class="d-flex align-items-center justify-content-between mb-2">
      <div class="d-flex align-items-center gap-2">
        <div class="d-flex align-items-center justify-content-center bg-primary text-white rounded-circle flex-shrink-0" style="width: 38px; height: 38px;">
          <i [class]="'bi ' + icon() + ' fs-6'"></i>
        </div>
        <span class="fw-semibold text-dark fs-6">{{ label() ?? '' }}</span>
      </div>
      <i class="bi bi-info-circle text-muted fs-6" role="img" aria-label="Info"></i>
    </div>

    <!-- Main Value -->
    <div class="fw-bold text-dark fs-2 mb-2 lh-1">{{ value() ?? '0' }}</div>

    <!-- Bottom Row: Trend Pill & Secondary Label -->
    <div class="d-flex align-items-center gap-2">
      @if (percentage() !== null && percentage() !== undefined) {
        <span class="badge bg-success bg-opacity-10 text-success fw-normal px-2 py-1 rounded-pill small d-inline-flex align-items-center gap-1">
          <i class="bi bi-arrow-up small"></i>{{ percentage() }}%
        </span>
      }
      <span class="text-secondary small">{{ secondaryLabel() ?? '' }}</span>
    </div>
  </div>
</div>
