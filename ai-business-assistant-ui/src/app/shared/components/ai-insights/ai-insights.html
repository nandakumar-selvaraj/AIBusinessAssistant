<div class="card orders-card p-4">
  <div class="card-body p-0">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-start mb-4">
      <div>
        <h4 class="fw-bold text-dark fs-5 mb-1">
          <i class="bi bi-stars text-primary me-2"></i>AI Insights
        </h4>
        <div class="text-secondary fs-6">Highlights from your business data</div>
      </div>
      <a [routerLink]="assistantLink" class="text-decoration-none fs-6">
        Ask AI <i class="bi bi-arrow-right"></i>
      </a>
    </div>

    <!-- Insight rows -->
    @for (insight of insights; track $index; let last = $last) {
    <div class="d-flex align-items-center gap-3">
      <i [class]="'bi ' + insight.icon + ' ' + insight.color + ' fs-5'"></i>
      <span class="flex-grow-1 text-dark fs-6">{{ insight.text }}</span>
      <a *ngIf="insight.link" [routerLink]="insight.link" class="text-secondary" aria-label="View details">
        <i class="bi bi-chevron-right"></i>
      </a>
    </div>
    @if (!last) {
    <hr class="text-muted opacity-25 my-3"> }
    }
  </div>
</div>
